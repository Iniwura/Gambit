<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#070d19"/>
<title>GAMBIT • Practice Arena</title>
<style>
*{box-sizing:border-box}html,body{padding:0;margin:0;width:100%;height:100%;overflow:hidden;background:#060b16;color:#fff;font-family:Inter,system-ui,sans-serif}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{touch-action:manipulation;display:block}
#status{position:fixed;left:12px;top:12px;z-index:5;pointer-events:none;font-size:11px;font-weight:750;letter-spacing:.09em;background:#101b32df;border:1px solid #345070;padding:8px 11px;border-radius:12px}
#error{display:none;position:fixed;inset:0;z-index:20;background:#101629;padding:30px;color:#ffbacd;font:16px system-ui}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button{font:inherit}a{color:#8bedf9}
@media(max-width:600px){#status{top:auto;bottom:6px;left:8px;font-size:10px}}
</style>
</head>
<body>
<div id="app" aria-label="GAMBIT solo practice arena"></div>
<div id="status" aria-live="polite">LOCAL PRACTICE · NOT ENCRYPTED</div>
<div id="game-state" role="status" aria-live="polite" class="visually-hidden" data-phase="boot" data-round="0">Loading game</div>
<div id="error" role="alert"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
