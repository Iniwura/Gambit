<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#070d19"/>
<title>GAMBIT • Practice Arena</title>
<style>
*{box-sizing:border-box}html,body{padding:0;margin:0;width:100%;height:100%;overflow:hidden;background:#060b16;color:#fff;font-family:Inter,system-ui,sans-serif}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{touch-action:manipulation;display:block}
#status{position:fixed;left:12px;top:12px;z-index:5;pointer-events:none;font-size:11px;font-weight:750;letter-spacing:.09em;background:#101b32df;border:1px solid #345070;padding:8px 11px;border-radius:12px}
#error{display:none;position:fixed;inset:0;z-index:20;background:#101629;padding:30px;color:#ffbacd;font:16px system-ui}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button{font:inherit}a{color:#8bedf9}
#gambit-mobile-deck{display:none}
@media(max-width:700px){
  #app{top:23px;bottom:auto;height:min(30vh,260px)}
  #status{top:4px;bottom:auto;left:8px;font-size:10px;pointer-events:none}
  #gambit-mobile-deck{
    position:fixed;top:calc(min(30vh,260px) + 30px);bottom:0;left:0;right:0;z-index:4;
    display:flex;flex-direction:column;gap:10px;padding:15px 16px max(18px,env(safe-area-inset-bottom));
    overflow-y:auto;overscroll-behavior:contain;background:#080f20;border-top:1px solid #294766;
    color:#edf6ff;box-shadow:0 -12px 32px #010513cc
  }
  #gambit-mobile-deck button{color:#edf6ff;background:#172a43;min-height:46px;padding:10px 8px;
    border:1px solid #385574;border-radius:12px;font:700 12px/1.2 Inter,system-ui,sans-serif;letter-spacing:.01em;
    touch-action:manipulation;cursor:pointer}
  #gambit-mobile-deck button[aria-pressed="true"]{background:#185668;border-color:#67e6f5;box-shadow:inset 0 0 0 1px #67e6f5}
  #gambit-mobile-deck button:disabled{opacity:.55;cursor:default}
  #gambit-mobile-deck button:focus-visible{outline:3px solid #ffdb85;outline-offset:3px}
  #gambit-mobile-deck [hidden]{display:none!important}
  .gambit-mobile-head{display:flex;justify-content:space-between;align-items:center;
    gap:12px;font-size:13px;letter-spacing:.1em}
  .gambit-mobile-head span{font-size:10px;color:#88a9c8;font-weight:750}
  .gambit-mobile-role-group,.gambit-mobile-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  #gambit-mobile-role-info{margin:0;color:#b9d2e4;font:500 12px/1.35 Inter,system-ui,sans-serif;min-height:17px}
  .gambit-mobile-commands{display:flex;flex-direction:column;gap:10px}
  .gambit-mobile-action-group{display:flex;flex-direction:column;gap:6px}
  .gambit-mobile-action-label{font:750 10px Inter,system-ui,sans-serif;letter-spacing:.12em;color:#9ab9d7}
  #gambit-mobile-deck button.gambit-mobile-primary{width:100%;min-height:54px;
    border-color:#65d9e8;background:#18647a;font-size:14px}
  .gambit-mobile-footnote{font:500 10px/1.4 Inter,system-ui,sans-serif;color:#86a5bf}
  #gambit-mobile-deck[data-phase="intro"] .gambit-mobile-role-group,
  #gambit-mobile-deck[data-phase="intro"] .gambit-mobile-commands,
  #gambit-mobile-deck[data-phase="intro"] #gambit-mobile-role-info{opacity:.6}
}
</style>
</head>
<body>
<div id="app" aria-label="GAMBIT solo practice arena"></div>
<div id="status" aria-live="polite">LOCAL PRACTICE · NOT ENCRYPTED</div>
<div id="game-state" role="status" aria-live="polite" class="visually-hidden" data-phase="boot" data-round="0">Loading game</div>
<div id="error" role="alert"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
