name: GAMBIT Phase 1 functional system contracts (no wallet)
on:
  push:
    branches: [build/verified-first-slice]
    paths:
      - 'src/blacksite/**'
      - 'src/profile/**'
      - 'scripts/readonly-provider-policy.mjs'
      - 'scripts/run-profile-readonly.mjs'
      - 'tests/readonly-provider-policy.test.mjs'
      - 'tests/blacksite-mission-contract.test.mjs'
      - 'tests/profile-evidence-contract.test.mjs'
      - 'tests/profile-discovery-contract.test.mjs'
      - 'scripts/verify-profile-duel1-readonly.mjs'
      - 'scripts/verify-profile-discovery-readonly.mjs'
      - 'scripts/verify-commander-public-history-readonly.mjs'
      - 'tests/profile-public-history-contract.test.mjs'
      - '.github/workflows/game-systems-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-real-chain-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned public and local dependencies
        run: npm ci --no-audit --no-fund
      - name: BLACKSITE local mission and Commander Profile evidence contracts
        run: node --test tests/blacksite-mission-contract.test.mjs tests/profile-evidence-contract.test.mjs tests/profile-discovery-contract.test.mjs tests/profile-public-history-contract.test.mjs tests/readonly-provider-policy.test.mjs
      - name: Verify first real Commander Profile record from public Sepolia (NO TX)
        timeout-minutes: 5
        run: node scripts/run-profile-readonly.mjs verify-profile-duel1-readonly.mjs
      - name: Discover real Duel 1 from canonical log pages and verify receipt (NO TX)
        timeout-minutes: 5
        run: node scripts/run-profile-readonly.mjs verify-profile-discovery-readonly.mjs
      - name: Verify opt-in Commander history for real Sepolia wallet (NO TX)
        timeout-minutes: 5
        run: node scripts/run-profile-readonly.mjs verify-commander-public-history-readonly.mjs
