name: Rules checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root test dependencies
        run: npm ci --no-audit --no-fund
      - name: Run deterministic local strategy tests
        run: npm test
