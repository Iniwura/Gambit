name: GAMBIT game architecture contracts
on:
  push:
    branches: [build/verified-first-slice]
    paths:
      - 'src/architecture/**'
      - 'tests/game-architecture-contract.test.mjs'
      - '.github/workflows/architecture-contracts.yml'
  pull_request:
    paths:
      - 'src/architecture/**'
      - 'tests/game-architecture-contract.test.mjs'
      - '.github/workflows/architecture-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-game-shell:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test strict platform capability/state boundary without network, wallet or game UI
        run: node --test tests/game-architecture-contract.test.mjs
